name: Metal

# The core on a Metal device: the GPU tests draw, compute and read back
# through Metal on the runner's Apple silicon GPU (the build workflow
# compiles and runs the host tests only).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winemetalgl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-tests:
    name: Metal GPU tests (Apple silicon)
    runs-on: macos-15
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show the Metal device
        run: system_profiler SPDisplaysDataType | sed -n '1,25p'

      - name: Configure for the build machine
        run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DWMGL_HOST_ONLY=ON

      - name: Build the core and tests
        run: cmake --build build/host --parallel 4

      - name: Run the GPU tests
        # Run and reported, not required, on this macOS 15 runner
        # (docs/unsupported.md#macos-15):
        # - compat_texture_unit_lod_bias, gpu_texture_lod_bias_vertex: sampler
        #   LOD bias is macOS 26 Metal API.
        # - gpu_review_converted_attributes_far_first: the virtual GPU ignores
        #   a negative base vertex.
        env:
          WMGL_GPU_NOT_REQUIRED: compat_texture_unit_lod_bias,gpu_texture_lod_bias_vertex,gpu_review_converted_attributes_far_first
        run: ./build/host/wmgl_gpu_tests

      - name: Run the draw overhead benchmark
        run: WMGL_BENCH=300 ./build/host/wmgl_gpu_tests bench_draw_overhead
