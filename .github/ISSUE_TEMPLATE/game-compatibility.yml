name: Game compatibility
description: Report how an OpenGL game runs on WineMetalGL, working or not
labels: [compatibility]
body:
  - type: input
    id: game
    attributes:
      label: Game
      placeholder: e.g. Mosa Lina
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Store and ID
      placeholder: e.g. Steam 2477090, GOG, itch.io
  - type: input
    id: gl
    attributes:
      label: OpenGL version the game needs
      placeholder: e.g. 3.2 core, 2.1
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works
        - Works with issues
        - Does not start
        - Crashes
        - Rendering errors
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WineMetalGL version, macOS version and Mac model
      placeholder: e.g. 2.2.0, macOS 27.2, MacBook Air M4
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What works, what does not, screenshots, and anything you changed to make it run.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Run with WINEMETALGL_LOG=2 and paste the winemetalgl lines.
      render: shell
