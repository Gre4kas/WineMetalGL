name: Bug report
description: A crash, a rendering error or wrong OpenGL behaviour in WineMetalGL
labels: [bug]
body:
  - type: input
    id: program
    attributes:
      label: Program or game
      placeholder: e.g. Dead Cells (deadcells_gl.exe)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WineMetalGL version
      placeholder: e.g. 2.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How WineMetalGL is installed
      options:
        - MetalSharp
        - Release package in MetalSharp's Wine
        - Wine module installed into my own Wine (install-wine-module.sh)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and Mac model
      placeholder: e.g. macOS 27.2, MacBook Air M4
    validations:
      required: true
  - type: input
    id: renderer
    attributes:
      label: GL_RENDERER
      description: It ends in "(WineMetalGL)" when the program uses WineMetalGL.
      placeholder: e.g. Apple M4 (WineMetalGL)
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, what happened instead, and screenshots if it is a rendering error.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Run with WINEMETALGL_LOG=2 and paste the winemetalgl lines and any crash log.
      render: shell
